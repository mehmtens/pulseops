services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulseops}
      POSTGRES_USER: ${POSTGRES_USER:-pulseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseops-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      API_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://pulseops:pulseops-local@postgres:5432/pulseops?sslmode=disable}
      PULSEOPS_API_TOKEN: ${PULSEOPS_API_TOKEN:-pulseops-local-token}
      PULSEOPS_WORKER_TOKEN: ${PULSEOPS_WORKER_TOKEN:-}
      PULSEOPS_LOCAL_CHECKS: ${PULSEOPS_LOCAL_CHECKS:-true}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SSL_WARNING_DAYS: ${SSL_WARNING_DAYS:-14}
      STATUS_PAGE_NAME: ${STATUS_PAGE_NAME:-PulseOps}
      STATUS_PAGE_MESSAGE: ${STATUS_PAGE_MESSAGE:-Live service health and incident updates.}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    environment:
      PULSEOPS_SITE_ADDRESS: ${PULSEOPS_SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-3000}:80"
      - "${WEB_HTTPS_PORT:-3443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
