apiVersion: 1
datasources:
  - name: PulseOps PostgreSQL
    uid: pulseops-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${GRAFANA_DB_USER}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
  - name: PulseOps Traces
    uid: pulseops-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
